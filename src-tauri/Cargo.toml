[package]
name = "vibecode"
version = "0.1.0"
description = "GUI vibe-coding workbench embedding Claude Code, Codex and git"
authors = ["3chan <chelly1221.com@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vibecode_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-log = "2.9.1"
tauri-plugin-window-state = "2.4.1"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
anyhow = "1.0.104"
vibecode-core = { version = "0.1.0", path = "../crates/core" }
log = "0.4.34"
tauri-plugin-notification = "2.4.0"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

