[package]
name = "vibecode-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tauri-independent core: agent adapters, backends, git, projects, db"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
futures = "0.3.34"
glob = "0.3"
keyring = "4.2.0"
notify = "8"
portable-pty = "0.9.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
toml = "1.1.5"
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["serde-compat", "uuid-impl", "chrono-impl", "serde-json-impl"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
which = "8.0.6"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile = "3.27.0"
