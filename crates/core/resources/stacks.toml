# no shell operators (&&, |, redirects), single command only.

# ---------------------------------------------------------------- desktop
[[stack]]
id = "tauri-react"
dev_command = "npm run dev"
name = "Tauri 2 + Rust + React/TS"
summary = "Rust 백엔드와 WebView 프론트로 가볍고 빠른 데스크톱 앱. 이 도구(vibecode)와 같은 스택."
targets = ["windows", "macos", "linux", "cross_desktop"]
types = ["desktop_app"]
languages = ["Rust", "TypeScript"]
scaffold_cmd = "npm create tauri-app@latest {name} -- --template react-ts --manager npm --yes"
prerequisites = ["node", "npm", "cargo", "rustup", "msvc"]
pros = ["설치 파일이 작고(수 MB) 메모리 사용이 적음", "Rust로 시스템 접근·성능 확보", "웹 생태계(React, Tailwind) 그대로 활용"]
cons = ["Rust 학습 곡선", "WebView 버전 차이로 렌더링이 OS마다 다를 수 있음", "빌드 시간이 긴 편"]
recommended = true
agent_notes = """
- 의존성 설치: `npm install`
- 개발 실행: `npm run tauri dev`
- 빌드(설치본): `npm run tauri build`
- Rust 검사/테스트: `cargo check` / `cargo test` (src-tauri 디렉터리)
- 프론트 타입검사: `npx tsc --noEmit`
- IPC는 `#[tauri::command]`로 노출하고 프론트에서 `invoke()`로 호출. 파일/프로세스 접근은 Rust 쪽에서.
"""

